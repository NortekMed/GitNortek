---
name: GitNortek Packages

on:
  push:
    tags:
    - 'v*.*.*'
    - '!v*.*.*-pre[0-9]*'

env:
  TAG_PATTERN: '^v[0-9]+\.[0-9]+\.[0-9]+(-pre\.[0-9]+)?$'

permissions:
  contents: read

jobs:
  rpm:
    name: Fedora RPM
    runs-on:
      group: Public-Releases
      labels: [self-hosted, linux, x64, gitnortek-linux]
    container: fedora:42@sha256:99e203b80b1c3d8f7e161ec10a68fd02b081ef83a3963553e513c82846b97814
    steps:
    - name: Validate tag
      run: |
        if [[ ! "${GITHUB_REF_NAME}" =~ ${TAG_PATTERN} ]]; then
          echo "Tag '${GITHUB_REF_NAME}' does not match expected format vX.Y.Z or vX.Y.Z-pre.N."
          exit 1
        fi

    - name: Install build dependencies
      run: |
        dnf -y update
        dnf -y install \
          appstream \
          cmake \
          gcc-c++ \
          git \
          libssh2-devel \
          ninja-build \
          openssl-devel \
          pkgconf-pkg-config \
          qt6-qtbase-devel \
          qt6-qttools-devel \
          qt6-qttranslations \
          rpm-build

    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        submodules: recursive

    - name: Configure
      run: >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
        -DGITTYUP_LINUX_PACKAGE_GENERATOR=RPM
        -DGENERATE_APPDATA=ON
        -DCMAKE_INSTALL_PREFIX=/usr
        -DENABLE_UPDATE_OVER_GUI=OFF
        -S . -B build/release

    - name: Build RPM
      run: ninja -C build/release package

    - name: Upload RPM
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: GitNortek-RPM
        path: build/release/pack/*.rpm
        if-no-files-found: error

  windows-exe:
    name: Windows EXE
    if: ${{ !contains(github.ref_name, '-pre') }}
    runs-on: windows-2022
    steps:
    - name: Validate tag
      shell: bash
      run: |
        if [[ ! "${GITHUB_REF_NAME}" =~ ${TAG_PATTERN} ]]; then
          echo "Tag '${GITHUB_REF_NAME}' does not match expected format vX.Y.Z or vX.Y.Z-pre.N."
          exit 1
        fi

    - name: Set git name and email
      run: |
        git config --global user.name "Your Name"
        git config --global user.email "youremail@yourdomain.com"

    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        submodules: recursive

    - name: Install Perl
      uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061 # v1
      with:
        perl-version: '5.30'

    - name: Install Qt
      uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
      timeout-minutes: 10
      with:
        version: 6.7.3
        target: desktop
        host: windows
        arch: win64_msvc2019_64
        install-deps: true
        modules: qtwebengine

    - name: Install Ninja
      uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6
      with:
        version: 1.11.1
        platform: win
        destination: ninja

    - name: Setup MSVC environment
      uses: seanmiddleditch/gha-setup-vsdevenv@cf96bf5b227cac6af28c04c4a4e69286ea444163 # v5
      with:
        arch: x64

    - name: Install NASM
      uses: ilammy/setup-nasm@9a15c8cb72fe84e3e00527b3014de04693cf60cf # v1.2.0

    - name: Install NSIS for CPack
      shell: pwsh
      run: |
        choco install nsis -y
        $nsis = @(
          'C:\Program Files (x86)\NSIS',
          'C:\Program Files\NSIS'
        ) | Where-Object { Test-Path $_ } | Select-Object -First 1
        if ($nsis) { Add-Content $env:GITHUB_PATH $nsis }

    - name: Build OpenSSL
      run: |
        cd dep/openssl/openssl
        perl Configure VC-WIN64A
        nmake

    - name: Configure
      env:
        CMAKE_RC_FLAGS: /C 1252
      run: >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
        -DUSE_SYSTEM_QT=OFF
        -DUSE_SYSTEM_LIBSSH2=OFF
        -DUSE_BUNDLED_ZLIB=1
        -DUSE_SSH:STRING=localbuild
        -DUSE_SYSTEM_OPENSSL=OFF
        -DCMAKE_C_COMPILER=cl
        -DCMAKE_CXX_COMPILER=cl
        -S . -B build/release

    - name: Build EXE installer
      run: ninja -C build/release package

    - name: Upload EXE
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: GitNortek-Windows-Installer
        path: build/release/pack/*.exe
        if-no-files-found: error

  release:
    name: GitHub Release
    needs: [rpm, windows-exe]
    if: >-
      ${{
        always() &&
        needs.rpm.result == 'success' &&
        (contains(github.ref_name, '-pre') || needs.windows-exe.result == 'success')
      }}
    runs-on:
      group: Public-Releases
      labels: [self-hosted, linux, x64, gitnortek-linux]
    container: ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
    - name: Install GitHub CLI
      run: |
        apt-get update
        apt-get install -y gh

    - name: Validate tag
      run: |
        if [[ ! "${GITHUB_REF_NAME}" =~ ${TAG_PATTERN} ]]; then
          echo "Tag '${GITHUB_REF_NAME}' does not match expected format vX.Y.Z or vX.Y.Z-pre.N."
          exit 1
        fi

    - name: Download artifacts
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
      with:
        path: artifacts

    - name: Create or update GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        shopt -s nullglob

        tag="${GITHUB_REF_NAME}"
        release_args=()
        require_windows=true
        if [[ "$tag" == *-pre* ]]; then
          release_args+=(--prerelease)
          require_windows=false
        fi

        rpms=(artifacts/GitNortek-RPM/*.rpm)
        installers=(artifacts/GitNortek-Windows-Installer/*.exe)
        files=("${rpms[@]}" "${installers[@]}")

        if [ ${#rpms[@]} -eq 0 ]; then
          echo "No RPM asset to upload."
          exit 1
        fi

        if $require_windows && [ ${#installers[@]} -eq 0 ]; then
          echo "No Windows installer asset to upload."
          exit 1
        fi

        if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            "${release_args[@]}" \
            --title "GitNortek $tag" \
            --target "${{ github.sha }}" \
            "${files[@]}"
        else
          gh release edit "$tag" \
            --repo "${{ github.repository }}" \
            "${release_args[@]}" \
            --title "GitNortek $tag"
          gh release upload "$tag" "${files[@]}" \
            --repo "${{ github.repository }}" \
            --clobber
        fi
